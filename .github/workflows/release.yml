name: release

# Tag-only release lane for updatable-cli compatible cara assets. All source
# dependencies are public and fetched anonymously over HTTPS; no SSH secret is
# required. Linux binaries use the system Rust toolchain, while the Darwin
# binary builds in the pinned Nix dev shell so libiconv is available.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to build and publish"
        required: true
        type: string
      target:
        description: "Exact target to backfill, or all targets"
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64-linux
          - aarch64-darwin

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: resolve release context
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      target: ${{ steps.context.outputs.target }}
      matrix: ${{ steps.context.outputs.matrix }}
    steps:
      - name: Configure isolated anonymous Git
        shell: bash
        run: |
          set -euo pipefail
          git_config="$RUNNER_TEMP/caravan-release-${GITHUB_RUN_ID}-${GITHUB_JOB}.gitconfig"
          {
            echo "GIT_CONFIG_GLOBAL=$git_config"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$git_config"
          export GIT_CONFIG_NOSYSTEM=1
          umask 077
          : > "$GIT_CONFIG_GLOBAL"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          test "$(git config --global --get url.https://github.com/.insteadOf)" = "ssh://git@github.com/"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: context
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          target="${{ inputs.target || 'all' }}"
          version="${tag#v}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vX.Y.Z, got: $tag" >&2
            exit 2
          }
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          cargo_version=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^version\ =\ \"([^\"]+)\" ]]; then
              cargo_version="${BASH_REMATCH[1]}"
              break
            fi
          done < <(git show "${tag}:Cargo.toml")
          [ -n "$cargo_version" ] || {
            echo "tag $tag has no package version in Cargo.toml" >&2
            exit 2
          }
          [ "$version" = "$cargo_version" ] || {
            echo "tag $tag does not match tagged Cargo.toml version $cargo_version" >&2
            exit 2
          }
          case "$target" in
            all)
              matrix='{"include":[{"target":"x86_64-linux","runner":["self-hosted","nix","x86_64-linux"],"timeout_minutes":120},{"target":"aarch64-darwin","runner":["self-hosted","nix","aarch64-darwin"],"timeout_minutes":90}]}'
              ;;
            x86_64-linux)
              matrix='{"include":[{"target":"x86_64-linux","runner":["self-hosted","nix","x86_64-linux"],"timeout_minutes":120}]}'
              ;;
            aarch64-darwin)
              matrix='{"include":[{"target":"aarch64-darwin","runner":["self-hosted","nix","aarch64-darwin"],"timeout_minutes":90}]}'
              ;;
            *)
              echo "unsupported release target: $target" >&2
              exit 2
              ;;
          esac
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "target=$target"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  test:
    name: release contract
    needs: resolve
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 30
    steps:
      - name: Configure isolated anonymous Git
        shell: bash
        run: |
          set -euo pipefail
          git_config="$RUNNER_TEMP/caravan-release-${GITHUB_RUN_ID}-${GITHUB_JOB}.gitconfig"
          {
            echo "GIT_CONFIG_GLOBAL=$git_config"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$git_config"
          export GIT_CONFIG_NOSYSTEM=1
          umask 077
          : > "$GIT_CONFIG_GLOBAL"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          test "$(git config --global --get url.https://github.com/.insteadOf)" = "ssh://git@github.com/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: Run the deterministic release suite in the pinned development shell
        # The process/load-sensitive hook target is feature-gated and owned by
        # the scheduled/manual environmental acceptance workflow.
        shell: bash
        run: nix develop --command cargo test --all
      - name: Exercise asset and self-update status contracts offline
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command cargo build --bin cara
          # The tag may predate later test-harness portability fixes. Execute
          # the reviewed harness from this workflow generation against tagged
          # source/binary inputs; fetch-depth=0 makes GITHUB_SHA available.
          contract="$RUNNER_TEMP/release-contract.sh"
          git show "$GITHUB_SHA:tests/release_contract.sh" > "$contract"
          git show "$GITHUB_SHA:scripts/release.sh" > scripts/release.sh
          git show "$GITHUB_SHA:.github/workflows/release.yml" > .github/workflows/release.yml
          chmod 0755 "$contract" scripts/release.sh
          nix develop --command "$contract" target/debug/cara

  build:
    name: build ${{ matrix.target }}
    needs:
      - resolve
      - test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Configure isolated anonymous Git
        shell: bash
        run: |
          set -euo pipefail
          git_config="$RUNNER_TEMP/caravan-release-${GITHUB_RUN_ID}-${GITHUB_JOB}-${{ matrix.target }}.gitconfig"
          {
            echo "GIT_CONFIG_GLOBAL=$git_config"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          export GIT_CONFIG_GLOBAL="$git_config"
          export GIT_CONFIG_NOSYSTEM=1
          umask 077
          : > "$GIT_CONFIG_GLOBAL"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          test "$(git config --global --get url.https://github.com/.insteadOf)" = "ssh://git@github.com/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Surface system toolchains
        shell: bash
        run: |
          for directory in /usr/bin /bin /usr/local/bin /opt/homebrew/bin "$HOME/.cargo/bin"; do
            if [ -d "$directory" ]; then echo "$directory" >> "$GITHUB_PATH"; fi
          done
          exit 0

      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "aarch64-darwin" ]; then
            nix develop '.#devShells.aarch64-darwin.default' --builders '' \
              --command ./scripts/build-darwin-release.sh
          else
            # bd-0629ce: publish statically linked Linux binaries. A
            # glibc-dynamic asset segfaults on NixOS under nix-ld with empty
            # output, which is indistinguishable from a quiet queue.
            nix build ".#packages.$TARGET.caravan-static" --out-link "result-$TARGET"
          fi

      - name: Package update-compatible asset
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "aarch64-darwin" ]; then
            binary="target/release/cara"
          else
            binary="result-$TARGET/bin/cara"
          fi
          nix develop --command ./scripts/package-release.sh "$VERSION" "$TARGET" "$binary" dist

      - name: Verify Linux assets are statically linked
        if: matrix.target != 'aarch64-darwin'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="result-$TARGET/bin/cara"
          # bd-0629ce: a dynamic interpreter here means the artifact can be
          # re-linked by the host loader (nix-ld on NixOS) and crash silently.
          if nix develop --command sh -c "command -v readelf" >/dev/null 2>&1; then
            interpreter="$(nix develop --command readelf -l "$binary" | grep -c 'interpreter' || true)"
          else
            interpreter="$(nix develop --command sh -c "file '$binary'" | grep -c 'dynamically linked' || true)"
          fi
          if [ "$interpreter" != "0" ]; then
            echo "release binary for $TARGET is dynamically linked; refusing to publish" >&2
            exit 1
          fi
          echo "$TARGET release binary is statically linked"

      - name: Smoke packaged native binary
        if: matrix.target != 'aarch64-linux'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          root="cara-$VERSION-$TARGET"
          rm -rf smoke
          mkdir smoke
          nix develop --command tar -xzf "dist/$root.tar.gz" -C smoke
          # The self-hosted Linux runners are NixOS, so this exercises the exact
          # loader path that crashed the previously published dynamic asset.
          "smoke/$root/cara" --version
          "smoke/$root/cara" --json status >/dev/null 2>&1 || true

      - name: Upload assets to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
