name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: caravan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Match the registered persistent Nix runner fleet explicitly. Generic
    # `azure-ephemeral` is intentionally not required for this repository.
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: |
          git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Agent surface smoke
        run: |
          cargo run -- help
          cargo run -- mcp tools >/dev/null
