name: CI

on:
  push:
    branches: [main]
  # Physical Caravan children target predecessor branches, so this trigger must
  # remain unfiltered and include every event that can refresh stacked CI.
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: caravan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Match the registered persistent Nix runner fleet explicitly. Generic
    # `azure-ephemeral` is intentionally not required for this repository.
    runs-on: [self-hosted, nix, x86_64-linux]
    # Main run 31349811279 exposed 16 logical CPUs to cold Cargo compilation on
    # caravan-ms-dev-5, then SIGKILLed the Caravan crate with exit 137. Bound
    # concurrent rustc/test processes and incremental-state memory on every
    # generic matching runner rather than depending on host CPU count
    # (bd-480dbc).
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    # Serializing a cold gate trades peak memory for wall time. Keep a finite
    # 90-minute runaway bound rather than weakening any required command.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: |
          git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true

      - name: Run pinned format, lint, test, and agent-surface gates
        shell: bash
        run: |
          # Not a login shell: `-l` re-sources the runner's profile files after
          # `nix develop` has established the devShell, which replaces PATH and
          # loses cargo/rustc/clippy/rustfmt (`cargo: command not found`, exit
          # 127, before any compilation). The gate needs no login semantics, so
          # this stays immune to runner profile drift (bd-07a962).
          nix develop --command bash -c '
            set -euo pipefail
            cargo fmt --all --check
            cargo clippy --all-targets -- -D warnings
            # tests/hook_example.rs requires environmental-hook-acceptance and
            # is owned by the schedule/manual lane, not blocking PR CI.
            cargo test --all
            cargo run -- help
            cargo run -- mcp tools >/dev/null
          '
