name: CI

on:
  push:
    branches: [main]
  # Code-generation events create one exact-head suite. Caravan membership is
  # NOT a workflow trigger: sync rerequests this same suite after admission, so
  # priority/force/park/unpark label churn cannot invalidate green CI.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: caravan-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_INCREMENTAL: "0"

jobs:
  admission-gate:
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 15
    outputs:
      run-ci: ${{ steps.gate.outputs.run_ci }}
      deferred-unjoined: ${{ steps.gate.outputs.deferred_unjoined }}
      decision: ${{ steps.gate.outputs.decision }}
    steps:
      # Gate policy/executable come from the trusted base generation, never PR
      # code. The command then fetches/verifies current default policy itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - id: gate
        name: Evaluate live Caravan membership
        shell: bash
        run: |
          set -euo pipefail
          nix develop --command cargo run --quiet -- \
            --json ci-admission-gate \
            --event "$GITHUB_EVENT_PATH" \
            --github-output "$GITHUB_OUTPUT" >/dev/null

  format:
    needs: admission-gate
    if: needs.admission-gate.outputs.run-ci == 'true'
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true
      - name: Check formatting
        run: nix develop --command cargo fmt --all --check

  clippy:
    needs: admission-gate
    if: needs.admission-gate.outputs.run-ci == 'true'
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true
      - name: Run strict Clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

  tests:
    needs: admission-gate
    if: needs.admission-gate.outputs.run-ci == 'true'
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true
      - name: Run complete test suite
        run: nix develop --command cargo test --all

  agent-surface:
    needs: admission-gate
    if: needs.admission-gate.outputs.run-ci == 'true'
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true
      - name: Verify help and MCP surfaces
        shell: bash
        run: |
          nix develop --command bash -c '
            set -euo pipefail
            cargo run -- help
            cargo run -- mcp tools >/dev/null
          '

  # Preserve the existing required context. Unjoined PRs deliberately fail only
  # this configured sentinel; Cara may still admit them. After membership, sync
  # rerequests the exact suite and every heavy job must pass.
  build-test:
    if: ${{ always() }}
    needs: [admission-gate, format, clippy, tests, agent-surface]
    runs-on: [self-hosted, nix, x86_64-linux]
    timeout-minutes: 5
    steps:
      - name: Defer unjoined PR or require every pinned gate
        shell: bash
        env:
          RUN_CI: ${{ needs.admission-gate.outputs.run-ci }}
          DEFERRED_UNJOINED: ${{ needs.admission-gate.outputs.deferred-unjoined }}
          FORMAT_RESULT: ${{ needs.format.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          AGENT_SURFACE_RESULT: ${{ needs.agent-surface.result }}
        run: |
          set -euo pipefail
          if [ "$DEFERRED_UNJOINED" = true ]; then
            echo "Caravan admission deferred: heavy CI starts after membership"
            exit 78
          fi
          test "$RUN_CI" = true
          test "$FORMAT_RESULT" = success
          test "$CLIPPY_RESULT" = success
          test "$TESTS_RESULT" = success
          test "$AGENT_SURFACE_RESULT" = success
