name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: caravan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # This disposable branch alone uses a hosted runner so rerun policy can be
    # accepted before the operator registers the release runner fleet.
    runs-on: ${{ startsWith(github.head_ref, 'dogfood/cara-v1-ci-rerun-fixture') && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","azure-ephemeral"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Intentional disposable CI failure for Caravan rerun acceptance
        if: startsWith(github.head_ref, 'dogfood/cara-v1-ci-rerun-fixture')
        run: |
          echo 'bd-322e38 intentional CI failure; this branch is never merged'
          exit 1

      - name: Use anonymous HTTPS for public ecosystem crates
        shell: bash
        run: |
          git config --global --unset-all url."ssh://git@github.com/".insteadOf 2>/dev/null || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Agent surface smoke
        run: |
          cargo run -- help
          cargo run -- mcp tools >/dev/null
