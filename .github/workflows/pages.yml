name: Pages

# Shared gh-pages publisher (harryaskham.github.io publish-pages.yml).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/check-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write # push gh-pages
  pages: write    # request the Pages build

jobs:
  pages:
    uses: harryaskham/harryaskham.github.io/.github/workflows/publish-pages.yml@main
    with:
      # Public repository: GitHub-hosted (free); fleet runners never serve public repos.
      runs-on: '["ubuntu-latest"]'
      path: site
      build: nix develop --command python3 scripts/check-site.py
