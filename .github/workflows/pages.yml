name: Pages

# Shared self-hosted publisher (harryaskham.github.io publish-pages.yml).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/check-site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: harryaskham/harryaskham.github.io/.github/workflows/publish-pages.yml@main
    with:
      path: site
      build: nix develop --command python3 scripts/check-site.py
