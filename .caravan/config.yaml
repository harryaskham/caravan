version: 1
force_merge: false
# Explicit opt-in: rewrites owned PR branches under exact force-with-lease.
rebase_on_join: false
# Highest to lowest; ties and unlabelled attempts use immutable PR createdAt FIFO.
agent_priority_labels:
  - caravan-priority:high
  - caravan-priority:normal
  - caravan-priority:low
command_timeout_secs: 30
repair:
  materialization_timeout_secs: 180
loop:
  interval_secs: 60
journal:
  max_bytes: 8388608
  max_archives: 3
hooks: {}
