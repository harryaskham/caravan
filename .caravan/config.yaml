version: 1
# Rolling system runtime sentinel: wrapper compatibility is source/config
# checked, while upgrades do not require a pin edit.
#
# Bumped to the github-native-stacks reader floor (MIN_GITHUB_STACK_READER_VERSION
# = 0.0.65) because this repo now opts into `stack_type: github`.
min_cara_version: "0.0.65"
# GitHub-native Stack owns landing; legacy one-shot force merge is disabled so
# Cacophony admission has a single reviewed merge actor.
force_merge: false
# Provider representation + landing backend: GitHub-native Stack objects with
# atomic stack-merge, matching how the caco layer now configures caravan
# (cacophony-config#114). Cara remains the scheduler/policy authority; this is a
# provider adapter, not a bypass of candidacy, priority, holds, CI, or receipts.
stack_type: github
# Explicit reviewed per-repository opt-in required before any native-Stack
# mutation (selecting stack_type: github alone never silently enables mutations).
stack_rollout:
  mutations_opt_in: true
  reviewed_by: "harryaskham (cacophony-config#114 caco-layer gh-stacks rollout)"
# Exact owner/name this policy governs (bd-ff639b): a managed agent checkout
# whose origin is a local daemon mirror cannot otherwise infer its repository.
repository: "harryaskham/caravan"
# Under stack_type: github, GitHub Stack mode owns physical branch rewriting
# (gh stack rebase/retarget); cara must not be a second physical branch writer,
# so rebase_on_join MUST be false here (enforced by `cara config check`).
rebase_on_join: false
# Highest to lowest; ties and unlabelled attempts use immutable PR createdAt FIFO.
agent_priority_labels:
  - caravan-priority:high
  - caravan-priority:normal
  - caravan-priority:low
command_timeout_secs: 30
# Automatic growth is sync-all-only and starts only after the existing fleet
# converges. Every candidate, provider call, mutation, and wall-clock phase is
# bounded; incompatible generations receive exact advisory skip receipts.
sync:
  # GitHub native Stack entries do not support provider auto-merge; cara must
  # own the head merge under stack_type: github.
  head_merge_actor: caravan
  actions:
    join_unlabelled_prs: true
  max_candidates_per_tick: 8
  max_mutations_per_tick: 64
  max_github_requests_per_tick: 256
  # Physical-chain planning preserves a conservative N-member apply reserve
  # inside this one absolute deadline before any provider or branch mutation.
  max_duration_secs: 900
repair:
  materialization_timeout_secs: 180
loop:
  interval_secs: 60
journal:
  max_bytes: 8388608
  max_archives: 3
hooks: {}
