<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Caravan · Repository operations</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script defer src="/assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">Skip to caravan workspace</a>
  <header class="masthead">
    <button id="toggle-repositories" class="sidebar-toggle" type="button" aria-controls="repository-sidebar" aria-expanded="true" title="Toggle repositories">☰ <span>Repositories</span></button>
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand-copy"><h1>Caravan</h1></div>
    <div class="masthead-actions">
      <span id="activity" class="activity" hidden aria-label="Refreshing"></span>
      <span id="connection" class="connection" role="status">Connecting</span>
      <button id="plan-sync" class="button" type="button" data-mutates="false" hidden>Plan sync</button>
      <button id="sync-all" class="button button-primary" type="button" hidden>Sync all</button>
      <button id="show-evidence" class="button" type="button" hidden>Evidence</button>
      <button id="show-config" class="button" type="button" hidden>Config</button>
      <button id="refresh-all" class="button" type="button">Refresh</button>
      <button id="toggle-attention" class="sidebar-toggle" type="button" aria-controls="attention-sidebar" aria-expanded="true" title="Toggle attention">Attention <span id="attention-count" class="sidebar-count">0</span></button>
    </div>
  </header>

  <main id="workspace" class="workspace" tabindex="-1">
    <nav id="repository-sidebar" class="repo-rail side-panel" aria-label="Repositories">
      <div class="rail-heading"><h2>Repositories</h2><button class="panel-close" type="button" data-close-sidebar="repositories" aria-label="Collapse repositories">‹</button></div>
      <div id="repo-tabs" class="repo-tabs" role="tablist" aria-label="Repository views"></div>
    </nav>

    <section class="content">
      <div id="dashboard" class="dashboard" hidden>
        <section id="repo-overview" class="overview-grid" aria-labelledby="repo-title"></section>

        <section class="section-block caravan-section" aria-labelledby="caravans-title">
          <div class="section-heading">
            <div><p class="eyebrow">Active topology</p><h2 id="caravans-title">Active caravans</h2></div>
          </div>
          <div id="caravans" class="caravan-list"></div>
        </section>

        <section class="section-block compact saloon-section" aria-labelledby="saloon-title">
          <div class="section-heading"><div><p class="eyebrow">Not yet joined</p><h2 id="saloon-title">Saloon</h2></div><span id="saloon-count" class="section-count">0 PRs</span></div>
          <div id="saloon" class="saloon-groups"></div>
        </section>
      </div>
    </section>

    <aside id="attention-sidebar" class="attention-rail side-panel" aria-labelledby="decisions-title">
      <div class="rail-heading"><div><p class="eyebrow">Attention</p><h2 id="decisions-title">Decisions &amp; blockers</h2></div><button class="panel-close" type="button" data-close-sidebar="attention" aria-label="Collapse decisions and blockers">›</button></div>
      <div id="decisions" class="card-stack"></div>
    </aside>
  </main>

  <aside id="inspector" class="inspector" hidden aria-labelledby="inspector-title">
    <header class="inspector-header">
      <div><p class="eyebrow" id="inspector-kicker">Repository</p><h2 id="inspector-title">Operational evidence</h2></div>
      <button id="close-inspector" class="icon-button" type="button" aria-label="Close inspector">×</button>
    </header>
    <div id="inspector-content" class="inspector-content"></div>
  </aside>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <template id="empty-template"><div class="empty-state"><span aria-hidden="true">◇</span><p></p></div></template>
</body>
</html>
